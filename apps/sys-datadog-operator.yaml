apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sys-datadog-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://helm.datadoghq.com
    targetRevision: 2.24.0  # Operator Helm Chart version
    chart: datadog-operator
  destination:
    server: https://kubernetes.default.svc
    namespace: datadog
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true